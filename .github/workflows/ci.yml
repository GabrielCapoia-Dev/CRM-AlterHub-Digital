name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: composer validate --strict --no-check-publish
      - run: composer audit --locked
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: php artisan test --parallel

  php-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: alterhub_testing
          MYSQL_USER: alterhub_test
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: alterhub_testing
      DB_USERNAME: alterhub_test
      DB_PASSWORD: ci-only-password
      DB_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run build

  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target app --tag alterhub-app:ci .
      - run: docker build --target nginx --tag alterhub-nginx:ci .
      - name: Boot Laravel from the immutable image
        run: >-
          docker run --rm
          --env APP_ENV=testing
          --env APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          --env CACHE_STORE=array
          --env SESSION_DRIVER=array
          --env QUEUE_CONNECTION=sync
          alterhub-app:ci php artisan about --only=environment
      - name: Validate Nginx configuration
        run: >-
          docker run --rm
          --env NGINX_SERVER_NAME=localhost
          --env NGINX_CLIENT_MAX_BODY_SIZE=20m
          --env NGINX_FASTCGI_READ_TIMEOUT=120s
          alterhub-nginx:ci nginx -t
