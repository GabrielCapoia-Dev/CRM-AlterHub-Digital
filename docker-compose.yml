name: ${COMPOSE_PROJECT_NAME:-alterhub}

x-app: &app
  image: ${APP_IMAGE:-alterhub/app:local}
  build:
    context: .
    target: app
  env_file:
    - path: .env
      required: false
  environment:
    DB_HOST: db
    DB_PORT: 3306
    REDIS_HOST: redis
    REDIS_PORT: 6379
  init: true
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - app_storage:/var/www/storage
    - app_bootstrap_cache:/var/www/bootstrap/cache
  networks:
    - edge
    - backend

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s = @fsockopen(\"127.0.0.1\", 9000); exit(is_resource($$s) ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  nginx:
    image: ${NGINX_IMAGE:-alterhub/nginx:local}
    build:
      context: .
      target: nginx
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-20m}
      NGINX_FASTCGI_READ_TIMEOUT: ${NGINX_FASTCGI_READ_TIMEOUT:-120s}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    init: true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/storage:ro
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=exports,default", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(str_contains(file_get_contents(\"/proc/1/cmdline\"), \"queue:work\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(str_contains(file_get_contents(\"/proc/1/cmdline\"), \"schedule:work\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-alterhub}
      MYSQL_USER: ${DB_USERNAME:-alterhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD:-no}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  app_storage:
  app_bootstrap_cache:
  db_data:
  redis_data:

networks:
  edge:
  backend:
    internal: true
