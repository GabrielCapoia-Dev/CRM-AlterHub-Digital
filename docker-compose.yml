services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE_APP}
    container_name: ${DOCKER_CONTAINER_APP}
    working_dir: /var/www
    env_file:
      - .env
    ports:
      - "${DOCKER_APP_PORT}:${APP_PORT}"
    volumes:
      - .:/var/www
      - ./vendor:/var/www/vendor
      - ./node_modules:/var/www/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ${DOCKER_NETWORK}

  cron:
    image: ${DOCKER_IMAGE_APP}
    container_name: ${DOCKER_CONTAINER_CRON}
    working_dir: /var/www
    env_file:
      - .env
    entrypoint: []
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ${DOCKER_NETWORK}

  db:
    image: ${DOCKER_IMAGE_DB}
    container_name: ${DOCKER_CONTAINER_DB}
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db_data:/var/lib/mysql
    ports:
      - "${DOCKER_DB_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ${DOCKER_NETWORK}

  phpmyadmin:
    image: ${DOCKER_IMAGE_PHPMYADMIN}
    container_name: ${DOCKER_CONTAINER_PHPMYADMIN}
    env_file:
      - .env
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DOCKER_PHPMYADMIN_PORT}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ${DOCKER_NETWORK}

volumes:
  db_data:

networks:
  ${DOCKER_NETWORK}:
    driver: bridge